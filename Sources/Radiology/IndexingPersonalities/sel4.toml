# Radiology indexing personality. Changes take effect on Reindex.
# Root settings use single-line strings, integers and string arrays.
schema_version = 1
id = "sel4"
name = "seL4"
summary = "Index kernel and user APIs across architectures and configurations."
engine = "sel4"
indexers = ["scip-sel4"]
project_limit = 1
clang_jobs = 1
bootstrap_python = ["python3.11", "python3.12", "python3.13", "python3.14", "python3"]

[runtime]
python_candidates = ["~/Library/Caches/Radiology/sel4-builds/venv/bin/python3", "python3"]
clang_candidates = ["/opt/homebrew/opt/llvm/bin/clang", "clang"]
required_clang_targets = ["aarch64", "arm", "riscv32", "riscv64", "x86", "x86-64"]
python_packages = ["ply==3.11", "PyYAML==6.0.3", "Jinja2==3.1.6", "lxml==6.1.3", "typing_extensions==4.16.0", "pyfdt==0.3", "six==1.17.0"]
python_imports = ["ply", "yaml", "jinja2", "lxml", "typing_extensions", "pyfdt", "six"]
cmake = "cmake"
ninja = "ninja"
dtc = "dtc"

[sel4]
required_files = ["CMakeLists.txt", "llvm.cmake", "tools/cpp_gen.sh", "libsel4/CMakeLists.txt"]
toolchain = "llvm.cmake"
build_targets = ["kernel_headers", "kernel_all_c_wrapper", "sel4_generated"]
build_jobs = 4
api_standard = "gnu99"
api_headers = ["sel4/sel4.h", "sel4/functions.h", "sel4/arch/mapping.h", "sel4/sel4_arch/mapping.h"]
unity_source = "kernel_all.c"
library_source = "libsel4/src/sel4_bootinfo.c"
# Original source bytes are indexed through includes in the upstream unity order.
# Only header generation's required bitfield/prune preprocessing is performed.
# Run configurations separately: one combined scip-clang run loses alternatives.

