<style>
/* Layout: an editor window. A strip of three cards (description, Marin context map, PR map) over a
   three-column work area: code path + focused file tree, diffs-first code, Claude session panel. Light only. */
:root {
  --bg: #f4f6f8;
  --pane: #ffffff;
  --ink: #1b2129;
  --muted: #677180;
  --rule: #dfe3e8;
  --soft: #eef1f5;
  --accent: #1f56a8;
  --accent-soft: #e6eefb;
  --add: #e7f5ea;
  --add-strong: #c9ebd1;
  --del: #fbeaea;
  --del-strong: #f3cccc;
  --note: #a8650b;
  --note-soft: #fdf3e2;
  --ok: #2f7a3d;
  --bad: #b03a3a;
  --font-ui: "IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", -apple-system, Arial, sans-serif;
  --font-code: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13px; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
code, .mono { font-family: var(--font-code); font-size: 12px; }
p code, li code, .l1 code, .l2 code, .l3 code, .msg code { background: var(--soft); padding: 0 3px; border-radius: 3px; font-size: 11.5px; }

#app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }

.bar { display: flex; align-items: center; gap: 14px; padding: 8px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--pane); border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.bar .crumb { font-family: var(--font-head); font-weight: 600; font-size: 15px; }
.bar .crumb span { color: var(--muted); font-weight: 500; }
.bar .meta { color: var(--muted); }
.bar .state { background: #ece6f8; color: #5b3a9a; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; letter-spacing: .03em; }
.bar .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { padding: 3px 10px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.toggle { border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; color: var(--muted); }
.toggle[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: #c4d5f1; }
.demo-note { font-size: 11px; color: var(--note); background: var(--note-soft); border-radius: 4px; padding: 2px 8px; }

.strip { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
.card { background: var(--pane); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; }
.card h3 { margin: 0 0 6px; font-family: var(--font-head); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.card h3 small { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--font-ui); }
.desc { max-height: 230px; overflow: auto; }
.l1 { margin: 0; font-size: 14px; line-height: 1.45; text-wrap: pretty; }
.l2, .l3 p { margin: 8px 0 0; line-height: 1.55; color: #2c3440; max-width: 72ch; }
.more { color: var(--accent); font-size: 12px; margin-top: 6px; }
.more:hover { text-decoration: underline; }
.map svg { width: 100%; height: auto; display: block; max-height: 196px; }
.node rect { fill: var(--pane); stroke: #b9c2ce; stroke-width: 1; rx: 5; }
.node text { fill: var(--ink); font-family: var(--font-ui); font-size: 10.5px; }
.node .sub { fill: var(--muted); font-size: 9px; }
.node { cursor: pointer; }
.node:hover rect { stroke: var(--accent); }
.node.here rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.node.on rect { fill: #fff6e5; stroke: var(--note); stroke-width: 1.5; }
.node.dim rect { fill: var(--soft); stroke: var(--rule); }
.node.dim text { fill: var(--muted); }
.edge { stroke: #9aa5b3; stroke-width: 1; fill: none; }
.edge-label { fill: var(--muted); font-size: 8.5px; font-family: var(--font-ui); }
.group rect { fill: #f7f9fb; stroke: #b9c2ce; stroke-dasharray: 4 3; rx: 8; }
.group text { fill: var(--muted); font-size: 9px; font-family: var(--font-ui); }

.work { display: grid; grid-template-columns: 270px minmax(0, 1fr) 390px; min-height: 0; }
.work.panel-closed { grid-template-columns: 270px minmax(0, 1fr) 36px; }
.left, #main, #panel { min-height: 0; overflow: auto; }
.left { background: var(--pane); border-right: 1px solid var(--rule); padding: 10px 0 24px; }
.left h4 { margin: 8px 14px 6px; font-family: var(--font-head); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { padding: 7px 14px 7px 12px; border-left: 3px solid transparent; cursor: pointer; display: grid; grid-template-columns: 20px 1fr; gap: 2px 6px; }
.step:hover { background: var(--soft); }
.step.on { background: var(--accent-soft); border-left-color: var(--accent); }
.step .n { font-family: var(--font-code); color: var(--muted); font-size: 11px; padding-top: 1px; }
.step .t { font-weight: 600; }
.step .s { grid-column: 2; color: var(--muted); font-size: 12px; line-height: 1.4; }
.step.moved .t::after { content: "moved by session"; margin-left: 6px; font-size: 10px; font-weight: 500; color: var(--note); background: var(--note-soft); padding: 0 5px; border-radius: 3px; }

.tree { font-size: 12px; padding: 0 6px 0 10px; }
.tree .row { display: flex; align-items: center; gap: 5px; padding: 2px 4px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree .row:hover { background: var(--soft); }
.tree .dir { color: var(--muted); font-family: var(--font-code); font-size: 11px; }
.tree .file.changed { font-weight: 500; }
.tree .file.quiet { color: var(--muted); }
.tree .hidden-count { color: var(--muted); font-size: 11px; font-style: italic; }
.tree .badge { font-family: var(--font-code); font-size: 9.5px; color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 3px; }
.tree .stat { margin-left: auto; font-family: var(--font-code); font-size: 10px; color: var(--muted); }
.tree .fileflag { width: 6px; height: 6px; border-radius: 50%; background: var(--note); flex: none; }

#main { padding: 12px 16px 80px; }
.step-head { margin: 4px 0 10px; }
.step-head h2 { margin: 0; font-family: var(--font-head); font-size: 17px; font-weight: 600; text-wrap: balance; }
.step-head .kicker { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-family: var(--font-head); }
.fcard { background: var(--pane); border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.fhead { display: flex; align-items: flex-start; gap: 8px; padding: 7px 10px; background: #fafbfc; border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 2; }
.fhead .chev { width: 16px; color: var(--muted); padding-top: 1px; }
.fhead .path { font-family: var(--font-code); font-size: 12px; }
.fhead .path .d { color: var(--muted); }
.fhead .fdesc { color: #3a4350; font-size: 12px; margin-top: 2px; }
.fhead .fdesc .more { font-size: 11px; margin: 0 0 0 4px; }
.fhead .grow { flex: 1; min-width: 0; }
.fhead .counts { font-family: var(--font-code); font-size: 11px; white-space: nowrap; padding-top: 1px; }
.counts .a { color: var(--ok); } .counts .r { color: var(--bad); }
.fhead .act { font-size: 11px; color: var(--muted); border: 1px solid var(--rule); border-radius: 5px; padding: 1px 7px; white-space: nowrap; background: var(--pane); }
.fhead .act:hover { color: var(--accent); border-color: #c4d5f1; }
.fbody { overflow-x: auto; }
.fbody .placeholder { padding: 10px 14px; color: var(--muted); font-size: 12px; }
.excerpt-label { padding: 4px 12px; font-size: 11px; color: var(--muted); background: var(--soft); border-top: 1px solid var(--rule); font-family: var(--font-code); }
.lines { min-width: max-content; }
.ln { display: grid; grid-template-columns: var(--blame-w, 0px) 44px 44px 16px auto; font-family: var(--font-code); font-size: 12px; line-height: 19px; }
.ln .no { color: #a0a8b3; text-align: right; padding-right: 8px; user-select: none; font-size: 11px; }
.ln .mk { user-select: none; text-align: center; color: var(--muted); }
.ln code { white-space: pre; padding-right: 24px; font-size: 12px; }
.ln.a { background: var(--add); } .ln.a .no { background: var(--add-strong); color: #4f7d59; }
.ln.d { background: var(--del); } .ln.d .no { background: var(--del-strong); color: #95595a; }
.ln.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { box-shadow: inset 4px 0 0 var(--note); background: #fff1cf; } 100% { box-shadow: inset 4px 0 0 transparent; } }
.ln .bl { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 10.5px; padding: 0 8px; border-right: 1px solid var(--rule); font-family: var(--font-ui); user-select: none; }
.ln .bl b { font-family: var(--font-code); font-weight: 400; color: var(--accent); }
.ln .mk.has { cursor: pointer; }
.ln .mk.has::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--note); margin-top: 5px; }
.ln .mk.has.resolved::before { background: #9aa5b3; }
.ln .mk.has.mine::before { background: var(--accent); }
.gap { display: flex; gap: 12px; align-items: center; padding: 3px 12px 3px 104px; background: #f1f5fb; color: var(--accent); font-size: 11.5px; border-block: 1px solid #e3eaf5; user-select: none; }
.gap button { color: var(--accent); }
.gap button:hover { text-decoration: underline; }
.gap .count { color: var(--muted); }
.inline-note { margin: 4px 12px 8px 104px; border: 1px solid #f0d7ab; background: var(--note-soft); border-radius: 6px; padding: 7px 10px; font-family: var(--font-ui); font-size: 12px; max-width: 760px; }
.inline-note .who { font-size: 11px; color: var(--muted); }

.hljs-keyword, .hljs-built_in.hljs-keyword { color: #8a3ab9; }
.hljs-string, .hljs-subst .hljs-string { color: #2a7a3b; }
.hljs-comment { color: #7d8792; font-style: italic; }
.hljs-number, .hljs-literal { color: #b0510a; }
.hljs-title, .hljs-title.function_, .hljs-title.class_ { color: #1f56a8; }
.hljs-built_in { color: #8a5a00; }
.hljs-meta { color: #8a5a00; }
.hljs-params { color: #2b3340; }
.hljs-section { color: #1f56a8; font-weight: 600; }
.hljs-bullet, .hljs-code { color: #8a3ab9; }

#panel { background: var(--pane); border-left: 1px solid var(--rule); display: flex; flex-direction: column; overflow: hidden; }
.phead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
.phead .ttl { font-weight: 600; }
.phead .sub { color: var(--muted); font-size: 11px; }
.phead .x { margin-left: auto; color: var(--muted); font-size: 16px; width: 24px; height: 24px; border-radius: 4px; }
.phead .x:hover { background: var(--soft); color: var(--ink); }
.ptabs { display: flex; border-bottom: 1px solid var(--rule); }
.ptabs button { flex: 1; padding: 7px; color: var(--muted); border-bottom: 2px solid transparent; }
.ptabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.pbody { flex: 1; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { line-height: 1.5; }
.msg.user { align-self: flex-end; background: var(--accent-soft); border-radius: 8px; padding: 7px 10px; max-width: 92%; }
.msg.agent p { margin: 0 0 7px; }
.msg.sys { color: var(--muted); font-size: 12px; border: 1px dashed var(--rule); border-radius: 6px; padding: 6px 9px; }
.msg.sys summary { cursor: pointer; }
.msg.sys ul { margin: 6px 0 0; padding-left: 18px; }
.action { display: flex; gap: 8px; align-items: center; border: 1px solid #f0d7ab; background: var(--note-soft); border-radius: 6px; padding: 6px 9px; font-size: 12px; }
.action button { margin-left: auto; color: var(--accent); font-weight: 500; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--pane); border: 1px solid #c4d5f1; color: var(--accent); border-radius: 4px; padding: 1px 6px; font-family: var(--font-code); font-size: 11px; margin: 0 4px 4px 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { color: var(--muted); }
.pfoot { border-top: 1px solid var(--rule); padding: 8px 12px 10px; }
.pfoot textarea { width: 100%; min-height: 56px; resize: vertical; border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px; font: inherit; color: var(--ink); background: var(--pane); }
.pfoot .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.pfoot .hint { color: var(--muted); font-size: 11px; }
.btn { background: var(--accent); color: #fff; border-radius: 6px; padding: 4px 12px; font-weight: 500; }
.btn.ghost { background: var(--pane); color: var(--ink); border: 1px solid var(--rule); }
.btn:disabled { opacity: .45; cursor: default; }
.finding { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.finding.focus { border-color: var(--note); box-shadow: 0 0 0 2px #f6e2bd; }
.finding .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.finding .loc { font-family: var(--font-code); color: var(--accent); cursor: pointer; }
.finding .loc:hover { text-decoration: underline; }
.pill { border-radius: 9px; padding: 0 7px; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; }
.pill.draft { background: var(--note-soft); color: var(--note); }
.pill.approved { background: #e3f3e6; color: var(--ok); }
.pill.rejected { background: var(--soft); color: var(--muted); text-decoration: line-through; }
.pill.posted { background: var(--accent-soft); color: var(--accent); }
.pill.resolved { background: var(--soft); color: var(--muted); }
.pill.sev { background: var(--soft); color: #4a5361; font-weight: 500; }
.finding .l1 { font-size: 13px; margin-top: 4px; }
.finding .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.finding .acts button { border: 1px solid var(--rule); border-radius: 5px; padding: 2px 9px; font-size: 12px; }
.finding .acts button:hover { border-color: var(--accent); color: var(--accent); }
.postbar { position: sticky; bottom: 0; background: var(--pane); border-top: 1px solid var(--rule); padding: 8px 0 0; display: flex; flex-direction: column; gap: 6px; }
.confirm { border: 1px solid #c4d5f1; background: #f5f8fe; border-radius: 6px; padding: 8px 10px; font-size: 12px; }
.confirm pre { white-space: pre-wrap; font-family: var(--font-code); font-size: 11px; background: var(--pane); border: 1px solid var(--rule); border-radius: 4px; padding: 6px; max-height: 160px; overflow: auto; }
.memory { border: 1px solid #c4d5f1; background: #f5f8fe; border-radius: 8px; padding: 10px; }
.memory h5 { margin: 0 0 6px; font-size: 12px; }
.memory .mem { background: var(--pane); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px; margin-top: 6px; font-size: 12px; line-height: 1.45; }
.memory .mem .target { font-family: var(--font-code); font-size: 10.5px; color: var(--accent); display: block; margin-bottom: 3px; }
.reopen { writing-mode: vertical-rl; transform: rotate(180deg); padding: 12px 0; width: 36px; color: var(--accent); font-weight: 500; }

.left { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.ltabs { display: flex; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--pane); z-index: 3; }
.ltabs button { flex: 1; padding: 8px 4px 7px; color: var(--muted); border-bottom: 2px solid transparent; font-size: 12px; }
.ltabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.lbody { flex: 1; overflow: auto; padding: 6px 0 12px; }
.lfoot { border-top: 1px solid var(--rule); padding: 6px 12px; color: var(--muted); font-size: 11px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lfoot label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.crow { display: grid; grid-template-columns: 14px 1fr auto; gap: 0 6px; padding: 5px 12px; cursor: pointer; border-left: 3px solid transparent; }
.crow:hover { background: var(--soft); }
.crow.on { border-left-color: var(--accent); background: var(--accent-soft); }
.crow .st { color: var(--muted); font-size: 10px; font-weight: 600; padding-top: 2px; }
.crow .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .pt { grid-column: 2; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.crow .ct { font-family: var(--font-code); font-size: 10.5px; font-variant-numeric: tabular-nums; text-align: right; }
.search { padding: 4px 12px 8px; }
.search input { width: 100%; border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; font: inherit; color: var(--ink); background: var(--pane); }
.sres .sf { padding: 6px 12px 2px; font-family: var(--font-code); font-size: 11px; color: var(--muted); }
.sres .sl { padding: 2px 12px 2px 20px; font-family: var(--font-code); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.sres .sl:hover { background: var(--soft); }
.sres .sl b { color: var(--muted); font-weight: 400; margin-right: 6px; }
.sres mark { background: #ffe9a8; color: inherit; }
[data-kbd]:focus-visible, .row:focus-visible, .crow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.bc { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
.bc button { color: var(--accent); }
.bc button:hover { text-decoration: underline; }
.node.hasdia rect { stroke-width: 1.5; }
.node .dia { fill: var(--accent); font-size: 9px; }
.node.code rect { fill: #fbfcfe; }
.node.code text:first-of-type { font-family: var(--font-code); font-size: 9.5px; }
#ctx { position: fixed; z-index: 21; background: var(--pane); border: 1px solid var(--rule); border-radius: 7px; box-shadow: 0 8px 24px rgba(20, 30, 50, .18); padding: 4px; min-width: 230px; }
#ctx button { display: flex; justify-content: space-between; gap: 16px; width: 100%; text-align: left; padding: 5px 9px; border-radius: 4px; }
#ctx button:hover { background: var(--accent-soft); }
#ctx button kbd { color: var(--muted); font-family: var(--font-ui); font-size: 11px; }
#ctx .sep { height: 1px; background: var(--rule); margin: 3px 0; }
#ctx .head { padding: 4px 9px; font-family: var(--font-code); font-size: 11px; color: var(--muted); }
#toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 7px 14px; border-radius: 7px; font-size: 12px; z-index: 30; max-width: min(560px, calc(100vw - 32px)); }

@media (max-width: 1100px) {
  .strip { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .strip .desc { grid-column: 1 / -1; }
  .work { grid-template-columns: 230px minmax(0, 1fr); }
  .work.panel-closed { grid-template-columns: 230px minmax(0, 1fr); }
  #panel { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--rule); max-height: 70vh; }
  #app { height: auto; }
  .left, #main { max-height: 80vh; }
}
@media (max-width: 700px) {
  .strip { grid-template-columns: minmax(0, 1fr); }
  .work, .work.panel-closed { grid-template-columns: minmax(0, 1fr); }
  .left { border-right: 0; border-bottom: 1px solid var(--rule); max-height: 50vh; }
  .gap, .inline-note { padding-left: 12px; margin-left: 12px; }
}
@media (prefers-reduced-motion: reduce) { .ln.flash { animation: none; background: #fff1cf; } }
</style>

function layered(key, l1, l2, l3) {
  const lvl = S.l[key] || 1;
  let h = `<p class="l1">${md(l1)}</p>`;
  if (lvl >= 2 && l2) h += `<p class="l2">${md(l2)}</p>`;
  if (lvl >= 3 && l3) h += `<div class="l3">${l3.map(p => `<p>${md(p)}</p>`).join("")}</div>`;
  const max = l3 ? 3 : l2 ? 2 : 1;
  if (max > 1) h += lvl < max ? `<button class="more" data-layer="${key}" data-to="${lvl + 1}">${lvl === 1 ? "More" : "Full description"}</button>` : `<button class="more" data-layer="${key}" data-to="1">Less</button>`;
  return h;
}

function clip(a, b) {
  const ax = a.x + a.w / 2, ay = a.y + a.h / 2, bx = b.x + b.w / 2, by = b.y + b.h / 2;
  const f = (n, dx, dy) => { const tx = dx ? (n.w / 2) / Math.abs(dx) : Infinity, ty = dy ? (n.h / 2) / Math.abs(dy) : Infinity; return Math.min(tx, ty); };
  const dx = bx - ax, dy = by - ay, ta = f(a, dx, dy), tb = f(b, dx, dy);
  return [ax + dx * ta, ay + dy * ta, bx - dx * tb, by - dy * tb];
}

/* ---------------- Highlighting ---------------- */
function splitHL(html) {
  const out = []; let stack = [], cur = "";
  const re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+)/g; let m;
  while ((m = re.exec(html))) {
    if (m[1]) { stack.push(m[1]); cur += m[1]; }
    else if (m[2]) { stack.pop(); cur += m[2]; }
    else if (m[3]) { cur += "</span>".repeat(stack.length); out.push(cur); cur = stack.join(""); }
    else cur += m[4];
  }
  out.push(cur + "</span>".repeat(stack.length));
  return out;
}
function hl(path) {
  if (HL[path]) return HL[path];
  const f = byPath[path], lang = path.endsWith(".md") ? "markdown" : "python";
  const head = f.lines.filter(l => l[2] != null).map(l => l[3]).join("\n");
  const base = f.lines.filter(l => l[1] != null).map(l => l[3]).join("\n");
  const run = t => window.hljs ? splitHL(hljs.highlight(t, { language: lang, ignoreIllegals: true }).value) : t.split("\n").map(esc);
  HL[path] = { head: run(head), base: run(base) };
  return HL[path];
}

    });

    if (S.confirm && approved.length) h += `<div class="confirm">These comments will post as one pending review on marin-community/marin#10640 from your account:<pre>${approved.map(f => `${SRC}${f.path}:${f.line}\n${f.l1}\n\n${f.l2}`).map(esc).join("\n\n---\n\n")}</pre><div style="display:flex;gap:6px"><button class="btn" id="doPost">Post review</button><button class="btn ghost" id="noPost">Cancel</button></div></div>`;
    h += `<button class="btn" id="postBtn" ${approved.length ? "" : "disabled"}>Post ${approved.length} approved note${approved.length === 1 ? "" : "s"} to GitHub</button><div class="hint" style="color:var(--muted);font-size:11px">${drafts} draft${drafts === 1 ? "" : "s"} waiting for a decision</div></div>`;
  }
  h += `</div>`;
  if (!S.memory) h += `<div class="pfoot"><div id="chips">${S.chips.map((c, i) => `<span class="chip">${esc(c.label)}<button data-unchip="${i}" aria-label="Remove">×</button></span>`).join("")}</div><textarea id="q" placeholder="Ask about the selection, a file, a symbol or a diagram box"></textarea><div class="row"><span class="hint">⌘> asks about the selection or the focused file, step, box or note. Right-click works too.</span><span style="flex:1"></span><button class="btn" id="send">Send</button></div></div>`;
  p.innerHTML = h;
}
function keepMemory(reason) {
  if (!S.memory) return;
  toast(S.memory.length ? `${S.memory.length} note${S.memory.length === 1 ? "" : "s"} kept: ${reason}.` : "No notes kept.");
  S.memory = null;
}
function addChip(c) { keepMemory("a new question started"); S.chips.push(c); S.panelOpen = true; S.tab = "session"; renderPanel(); $("q") && $("q").focus(); }
function chipFor(el) {
  if (!el) return null;
  const file = el.closest("[data-file],[data-fhead]");
  if (file) { const p = file.dataset.file || file.dataset.fhead; return { label: `file ${p.replace(SRC, "")}` }; }
  const node = el.closest("[data-node]");
  if (node) { const n = nodeById(node.dataset.node); return n.at ? { label: `${n.label} · ${n.at[0]}:${n.at[1]}` } : { label: `component ${n.label}` }; }
  const st = el.closest("[data-step]");
  if (st) { const s = STEPS.find(x => x.id === +st.dataset.step); return { label: `step ${s.id} · ${s.title}` }; }
  const fc = el.closest("[data-fcard]");
  if (fc) { const f = FINDINGS.find(x => x.id === fc.dataset.fcard); return { label: `note ${f.path}:${f.line}` }; }
  return null;
}
function nodeById(id) { return [...CTX.nodes, ...SUB.nodes, ...Object.values(STEP_DIA).flatMap(d => d.nodes)].find(x => x.id === id); }
function goToLineInStep(rel, n) {
  const s = STEPS.find(x => x.id === S.step);
  if (S.mode === "steps" && s.ex.some(([p, a, b]) => p === rel && a <= n && n <= b)) {
    const row = $("main").querySelector(`.ln[data-path="${CSS.escape(SRC + rel)}"][data-n="${n}"]`);
    if (row) { row.scrollIntoView({ block: "center", behavior: "smooth" }); row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash"); return; }
  }
  goToLine(SRC + rel, n);
}

/* ---------------- Navigation ---------------- */
function goToLine(path, n, opts = {}) {
  const f = byPath[path]; if (!f || !f.lines) { toast("That file is outside the demo data. In the app, definitions anywhere in the repo open here."); return; }
  if (S.mode !== "files") { S.mode = "files"; syncMode(); }
  S.collapsed["c:" + path] = false;
  const key = "f:" + path, rev = S.reveal[key] || (S.reveal[key] = new Set());
  const idx = f.lines.findIndex(l => l[2] === n);
  for (let k = Math.max(0, idx - 6); k <= Math.min(f.lines.length - 1, idx + 14); k++) rev.add(k);
  renderMain(); renderLeft();
  const row = document.querySelector(`.ln[data-path="${CSS.escape(path)}"][data-n="${n}"]`);
  if (row) { row.scrollIntoView({ block: "center", behavior: opts.instant ? "auto" : "smooth" }); row.classList.add("flash"); }
}
function goStep(id) { S.mode = "steps"; S.step = id; syncMode(); $("main").scrollTop = 0; }
function syncMode() {
  $("modeSteps").setAttribute("aria-pressed", S.mode === "steps"); $("modeFiles").setAttribute("aria-pressed", S.mode === "files");
  renderLeft(); renderMaps(); renderMain();
}
function wordAt(x, y) {
  let node, off;
  if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(x, y); if (!r) return null; node = r.startContainer; off = r.startOffset; }
  else if (document.caretPositionFromPoint) { const r = document.caretPositionFromPoint(x, y); if (!r) return null; node = r.offsetNode; off = r.offset; }
  if (!node || node.nodeType !== 3) return null;
  const t = node.textContent; let a = off, b = off;
  while (a > 0 && /\w/.test(t[a - 1])) a--; while (b < t.length && /\w/.test(t[b])) b++;
  return a < b ? t.slice(a, b) : null;
}
function defOf(word) { const d = D.symbols[word]; return d && d[0]; }

/* ---------------- Context menu ---------------- */
function menu(x, y, head, items) {
  const c = $("ctx");
  c.innerHTML = (head ? `<div class="head">${esc(head)}</div>` : "") + items.map((it, i) => it === "-" ? `<div class="sep"></div>` : `<button data-mi="${i}">${esc(it.label)}${it.kbd ? `<kbd>${it.kbd}</kbd>` : ""}</button>`).join("");
  c.hidden = false;
  c.style.left = Math.min(x, innerWidth - 250) + "px"; c.style.top = Math.min(y, innerHeight - c.offsetHeight - 8) + "px";
  c.onclick = e => { const b = e.target.closest("[data-mi]"); if (!b) return; c.hidden = true; items[+b.dataset.mi].run(); };
}
document.addEventListener("click", e => { if (!e.target.closest("#ctx")) $("ctx").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("ctx").hidden = true; if (S.zoom) { S.zoom = null; renderMaps(); } } });
const newWindow = what => () => toast(`In the app this opens ${what} in a new code-only window. Questions asked there go to this session.`);

document.addEventListener("contextmenu", e => {
  const ln = e.target.closest(".ln"), fh = e.target.closest("[data-fhead]"), node = e.target.closest("[data-node]"), tf = e.target.closest("[data-file]");
  if (ln) {
    e.preventDefault();
    const w = wordAt(e.clientX, e.clientY), d = w && defOf(w), path = ln.dataset.path, n = +ln.dataset.n;
    const items = [];
    if (d) items.push({ label: `Go to definition of ${w}`, kbd: "⌘-click", run: () => goToLine(d[0], d[1]) }, { label: "Open definition in new window", run: newWindow(w) });
    if (S.pendingSel) items.push({ label: "Ask about the selection", kbd: "⌘>", run: () => addChip(S.pendingSel) });
    if (w) items.push({ label: `Ask about ${w}`, kbd: S.pendingSel ? "" : "⌘>", run: () => addChip({ label: `symbol ${w}${d ? " · " + d[0].slice(SRC.length) + ":" + d[1] : ""}` }) });
    if (n) items.push({ label: `Ask about line ${n}`, run: () => addChip({ label: `${path.slice(SRC.length)}:${n}` }) });
    items.push("-", { label: S.blame ? "Hide blame" : "Show blame", run: () => { S.blame = !S.blame; $("blameBtn").setAttribute("aria-pressed", S.blame); renderMain(); } });
    menu(e.clientX, e.clientY, w || null, items);
  } else if (fh || tf) {
    e.preventDefault();
    const path = (fh || tf).dataset.fhead || (fh || tf).dataset.file;
    menu(e.clientX, e.clientY, path.split("/").pop(), [
      { label: "Ask about this file", kbd: "⌘>", run: () => addChip({ label: `file ${path.replace(SRC, "")}` }) },
      { label: "Open file in new window", run: newWindow(path.split("/").pop()) },
      { label: "Show whole file", run: () => { S.full[path] = true; renderMain(); } }
    ]);
  } else if (node) {
    e.preventDefault();
    const n = nodeById(node.dataset.node), items = [{ label: `Ask about ${n.label}`, kbd: "⌘>", run: () => addChip(chipFor(node)) }];
    if (n.at) items.push({ label: "Open its code", run: () => goToLineInStep(n.at[0], n.at[1]) });
    else if (n.step) {
      items.push({ label: `Go to step ${n.step}`, run: () => goStep(n.step) });
      if (STEP_DIA[n.step]) items.push({ label: "Open step diagram", kbd: "double-click", run: () => { S.zoom = n.step; goStep(n.step); } });
    } else if (!S.zoom || node.closest("#ctxMap")) items.push({ label: `Open the ${n.label} page`, run: () => toast(`In the app this opens the ${n.label} page: description, its place in Marin, its own map and its files.`) });
    menu(e.clientX, e.clientY, n.label, items);
  } else if (e.target.closest("[data-step],[data-fcard]")) {
    e.preventDefault();
    const el = e.target.closest("[data-step],[data-fcard]"), c = chipFor(el);
    menu(e.clientX, e.clientY, c.label, [{ label: "Ask Claude", kbd: "⌘>", run: () => addChip(c) }]);
  }
});
document.addEventListener("dblclick", e => {
  const nd = e.target.closest("#subMap [data-node]");
  if (!nd || S.zoom) return;
  const n = SUB.nodes.find(x => x.id === nd.dataset.node);
  if (!n) return;
  if (STEP_DIA[n.step]) { S.zoom = n.step; goStep(n.step); }
  else toast(`Step ${n.step} has no diagram of its own; its code is short enough to read directly.`);
});

/* ---------------- Events ---------------- */
document.addEventListener("click", e => {
  const t = e.target;
  const lay = t.closest("[data-layer]"); if (lay) { S.l[lay.dataset.layer] = +lay.dataset.to; const k = lay.dataset.layer; if (k === "pr") renderDesc(); else if (k.startsWith("n:")) renderPanel(); else renderMain(); return; }
  const st = t.closest("[data-step]"); if (st) { goStep(+st.dataset.step); return; }
  const sg = t.closest("[data-step-go]"); if (sg) { goStep(+sg.dataset.stepGo); return; }
  const lt = t.closest("[data-ltab]"); if (lt) { S.ltab = lt.dataset.ltab; renderLeft(); if (S.ltab === "search") $("sq").focus(); return; }
  const hit = t.closest("[data-hit]"); if (hit) { const [p, n] = hit.dataset.hit.split("|"); goToLine(p, +n); return; }
  const dm = t.closest("[data-dropmem]"); if (dm) { S.memory.splice(+dm.dataset.dropmem, 1); renderPanel(); return; }
  if (t.id === "unzoom") { S.zoom = null; renderMaps(); return; }
  const nd = t.closest("[data-node]");
  if (nd) {
    const n = nodeById(nd.dataset.node);
    if (nd.closest("#subMap") && S.zoom) { if (n.at) goToLineInStep(n.at[0], n.at[1]); else toast(`${n.label} is outside this repository.`); }
    else if (nd.closest("#subMap")) { if (S.step !== n.step || S.mode !== "steps") goStep(n.step); }
    else toast(n.here ? "You are reviewing a change to Shellbox. In the app, this opens the Shellbox page." : `In the app this opens the ${n.label} page, with its own description, maps and files.`);
    return;
  }
  const rv = t.closest("[data-rv]"); if (rv) { const [key, a, b] = rv.dataset.rv.split("|"); const set = S.reveal[key] || (S.reveal[key] = new Set()); for (let i = +a; i < +b; i++) set.add(i); const y = $("main").scrollTop; renderMain(); $("main").scrollTop = y; return; }
  const fu = t.closest("[data-full]"); if (fu) { S.full[fu.dataset.full] = !S.full[fu.dataset.full]; renderMain(); return; }
  const co = t.closest("[data-collapse]"); if (co) { const k = "c:" + co.dataset.collapse; const f = byPath[co.dataset.collapse]; const cur = S.collapsed[k] ?? (S.mode === "files" && !f.lines); S.collapsed[k] = !cur; renderMain(); return; }
  const td = t.closest("[data-tdir]"); if (td) {
    const k = td.dataset.tdir;
    // Unchanged-file lists and tests start closed (open when false); other folders start open (closed when true).
    if (k.startsWith("q:") || k === "t:tests") S.collapsed[k] = S.collapsed[k] === false;
    else S.collapsed[k] = S.collapsed[k] !== true;
    renderTree(); return;
  }
  const tf = t.closest("[data-file]"); if (tf) { const p = tf.dataset.file; S.curFile = p; S.mode = "files"; S.collapsed["c:" + p] = false; syncMode(); const el = document.getElementById("card:" + p); el && el.scrollIntoView({ block: "start" }); return; }
  const fq = t.closest("[data-quiet]"); if (fq) { toast("Unchanged file. In the app it opens in the code viewer, with its wordbase description."); return; }
  const mk = t.closest("[data-finding]"); if (mk) { S.focusFinding = S.focusFinding === mk.dataset.finding ? null : mk.dataset.finding; S.tab = "review"; S.panelOpen = true; S.memory = null; const y = $("main").scrollTop; renderMain(); $("main").scrollTop = y; renderPanel(); const c = document.querySelector(`[data-fcard="${S.focusFinding}"]`); c && c.scrollIntoView({ block: "nearest" }); return; }
  const gt = t.closest("[data-goto]"); if (gt) { const f = FINDINGS.find(x => x.id === gt.dataset.goto); S.focusFinding = f.id; renderPanel(); goToLine(SRC + f.path, f.line); return; }
  const se = t.closest("[data-set]"); if (se) { const [id, s] = se.dataset.set.split("|"); FINDINGS.find(x => x.id === id).status = s; S.confirm = false; renderPanel(); renderMain(); renderLeft(); return; }
  const tab = t.closest("[data-tab]"); if (tab) { S.tab = tab.dataset.tab; renderPanel(); return; }
  const uc = t.closest("[data-unchip]"); if (uc) { S.chips.splice(+uc.dataset.unchip, 1); renderPanel(); return; }
  if (t.id === "postBtn") { S.confirm = true; renderPanel(); $("pbody").scrollTop = 1e6; return; }
  if (t.id === "noPost") { S.confirm = false; renderPanel(); return; }
  if (t.id === "doPost") { FINDINGS.forEach(f => { if (f.status === "approved") f.status = "posted"; }); S.confirm = false; renderPanel(); renderMain(); toast("Demo only: nothing was sent. In the app this creates one pending review with gh and then submits it."); return; }
  if (t.id === "applyMove") { S.moved = !S.moved; if (S.moved) goStep(6); else renderSteps(); renderPanel(); return; }
  if (t.id === "send") { const q = $("q").value.trim(); if (!q && !S.chips.length) return; S.sent.push({ text: q || "(no text)", chips: S.chips }); S.chips = []; renderPanel(); $("pbody").scrollTop = 1e6; return; }
  if (t.id === "closePanel") {
    S.memory = [
      { target: "wordbase/lib/shellbox/src/shellbox/http_service.py.md · notes", text: "The relay's failure behavior under a stuck model endpoint comes from three limits defined in `http_service_guest.py` and imported by the host: 16 pending requests, 4 MiB bodies and a 600 s timeout. The guest starts its timeout when it emits a request and the host starts its own when the handler task begins, so the guest always gives up first." },
      { target: "wordbase/systems/shellbox.md · notes", text: "Relay throughput over cluster exec transports was the open design question in the #10640 review. #10118 records earlier incidents with the same kind of transport, and the relay at 01a8bb8 has no counters for in-flight requests, queue depth or drops." },
      { target: "wordbase/reviewer.md · how you review", text: "On Shellbox changes you start from cancellation, teardown and failure under load, and you ask how a component behaves when a dependency hangs." }
    ];
    renderPanel(); return;
  }
  if (t.id === "memKeep") { keepMemory("added to the wordbase (demo)"); S.panelOpen = false; renderPanel(); return; }
  if (t.id === "reopen") { S.panelOpen = true; renderPanel(); return; }
  if (t.id === "modeSteps") { S.mode = "steps"; syncMode(); return; }
  if (t.id === "modeFiles") { S.mode = "files"; syncMode(); return; }
  if (t.id === "blameBtn") { S.blame = !S.blame; t.setAttribute("aria-pressed", S.blame); const y = $("main").scrollTop; renderMain(); $("main").scrollTop = y; return; }
  if ((e.metaKey || e.ctrlKey) && t.closest(".ln code")) { const w = wordAt(e.clientX, e.clientY), d = w && defOf(w); if (d) goToLine(d[0], d[1]); else if (w) toast(`No definition for ${w} in the demo's symbol table.`); }
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && (e.key === ">" || (e.shiftKey && e.key === "."))) {
    // Ask about the code selection, else the focused row, box or note, else the open step.
    e.preventDefault();
    const s = STEPS.find(x => x.id === S.step);
    const c = S.pendingSel || chipFor(document.activeElement) || (S.mode === "steps" ? { label: `step ${s.id} · ${s.title}` } : null);
    if (c) addChip(c); else toast("Select code or focus a file, step, box or note first.");
  }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "q") { e.preventDefault(); $("send").click(); }
  if (e.key === "Enter" && e.target.closest && e.target.closest("[data-step],[data-node]")) e.target.click();
});
document.addEventListener("selectionchange", () => {
  const sel = window.getSelection(), txt = sel && sel.toString();
  S.pendingSel = null;
  if (!txt || !txt.trim()) return;
  const up = n => n && (n.nodeType === 1 ? n : n.parentElement);
  const a = up(sel.anchorNode) && up(sel.anchorNode).closest(".ln"), b = up(sel.focusNode) && up(sel.focusNode).closest(".ln");
  if (!a || !b) return;
  const ns = [a, b].map(x => +x.dataset.n || 0).filter(Boolean).sort((x, y) => x - y);
  S.pendingSel = { label: `${a.dataset.path.replace(SRC, "")}:${ns[0]}${ns[1] && ns[1] !== ns[0] ? "-" + ns[1] : ""} · selection` };
});
document.addEventListener("input", e => { if (e.target.id === "sq") { S.query = e.target.value; renderSearch(); } });
document.addEventListener("change", e => { if (e.target.id === "hideTests") { S.hideTests = e.target.checked; renderChanges(); } });

/* ---------------- Boot ---------------- */
fetch("pr10640.json").then(r => r.json()).then(data => {
  D = data; D.files.forEach(f => byPath[f.path] = f);
  renderDesc(); renderMaps(); renderLeft(); renderMain(); renderPanel();
}).catch(() => { $("main").innerHTML = `<p style="padding:20px">The PR data file did not load. Reload the page to try again.</p>`; });
</script>
